sudo: required
language: java
jdk:
 - oraclejdk8
services:
 - docker
before_cache:
  - rm -f  $HOME/.gradle/caches/modules-2/modules-2.lock
  - rm -fr $HOME/.gradle/caches/*/plugin-resolution/
cache:
  directories:
    - $HOME/.gradle/caches/
    - $HOME/.gradle/wrapper/
env:
  global:
    - SONAR_HOST_URL=https://sonarcloud.io
    - GITHUB_API_URL=https://api.github.com
    - PROJECT_KEY=ioet_bpm-people-api
    - ORGANIZATION=ioet
    - secure: 
addons:
  sonarcloud:
after_success:
 - bash <(curl -s https://codecov.io/bash)
 - ./gradlew sonarqube -Dsonar.projectKey=$PROJECT_KEY -Dsonar.organization=$ORGANIZATION -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_GITHUB_TOKEN
 - pip install --user awscli
 - eval $(aws ecr get-login --no-include-email --region us-east-1)
 - docker build -t bpm-people-api:$TRAVIS_BUILD_ID . --build-arg JAR_FILE=build/libs/bpm-people-api-0.0.1.jar
 - docker tag bpm-people-api:$TRAVIS_BUILD_ID 524819651720.dkr.ecr.us-east-1.amazonaws.com/bpm-people-api:$TRAVIS_BUILD_ID
 - docker push 524819651720.dkr.ecr.us-east-1.amazonaws.com/bpm-people-api:$TRAVIS_BUILD_ID
 - docker build -t bpm-people-api . --build-arg JAR_FILE=build/libs/bpm-people-api-0.0.1.jar
 - docker tag bpm-people-api:latest 524819651720.dkr.ecr.us-east-1.amazonaws.com/bpm-people-api:latest
 - docker push 524819651720.dkr.ecr.us-east-1.amazonaws.com/bpm-people-api:latest